<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student portal – EduChain</title><link rel="stylesheet" href="css/style.css"></head><body>
<nav class="nav"><a class="logo" href="index.html"><i>🎓</i><span>EduChain</span></a><div class="links"><a href="index.html" class="">Home</a><a href="student.html" class="on">Student</a><a href="institution.html" class="">Institution</a><a href="verify.html" class="">Verify</a><a href="admin.html" class="">Admin</a></div><button class="btn" id="wbtn">Connect wallet</button></nav>
<main class="wrap"><h1>Student portal</h1><p class="sub">Your certificates, tied to your wallet.</p><div id="list"><div class="notice">Connect your wallet to see your certificates.</div></div></main>
<footer>© 2026 EduChain · Built on BOT Chain<br><a href="https://botchain.ai" target="_blank" rel="noopener">BOT Chain Website</a> · <a href="https://scan.bohr.life" target="_blank" rel="noopener">BOT Chain Explorer</a></footer><div id="toast"></div><script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script><script src="js/app.js"></script>
<script>
document.addEventListener("ready",async()=>{
  const ids=await vault.certsOf(account);let h="";
  for(const id of [...ids].reverse()){const c=await vault.getCert(id),ok=!c[7];
    h+=`<div class="cert"><div class="top"><span class="badge ${ok?"ok":"bad"}">${ok?"Valid":"Revoked"}</span><span style="color:var(--mut);font-size:13px">ID ${id} · ${when(c[6])}</span></div><h3>${esc(c[4])}</h3><div>Issued by <b>${esc(c[1])}</b></div><div class="mono" style="color:var(--mut)">File: ${esc(c[5])||"—"}</div><div class="acts"><button class="btn sm" data-l="${id}">Copy verify link</button><a class="btn sm ghost" href="verify.html?id=${id}">Open verification</a></div></div>`}
  $("#list").innerHTML=h||'<div class="panel empty">No certificates have been issued to this wallet yet.</div>';
  document.querySelectorAll("[data-l]").forEach(b=>b.onclick=()=>{navigator.clipboard.writeText(new URL("verify.html?id="+b.dataset.l,location.href).href);toast("Verification link copied")});
});
</script></body></html>
