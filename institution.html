<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Institution portal – EduChain</title><link rel="stylesheet" href="css/style.css"></head><body>
<nav class="nav"><a class="logo" href="index.html"><i>🎓</i><span>EduChain</span></a><div class="links"><a href="index.html" class="">Home</a><a href="student.html" class="">Student</a><a href="institution.html" class="on">Institution</a><a href="verify.html" class="">Verify</a><a href="admin.html" class="">Admin</a></div><button class="btn" id="wbtn">Connect wallet</button></nav>
<main class="wrap"><h1>Institution portal</h1><p class="sub">Issue and manage certificates.</p><div id="gate"><div class="notice">Connect your wallet to continue.</div></div>
<div id="inst" style="display:none"><div class="panel"><h2>Issue a certificate</h2><label>Student wallet address</label><input id="sa" placeholder="0x…"><label>Student full name</label><input id="sn" placeholder="e.g. Ada Okafor"><label>Certificate title</label><input id="ti" placeholder="e.g. B.Sc. Computer Science, First Class"><label>Certificate file hash / IPFS CID (optional)</label><input id="fh" placeholder="bafy…"><br><br><button class="btn" id="iss">Issue certificate</button></div>
<div class="panel"><h2>Issued certificates</h2><div style="overflow-x:auto"><table><thead><tr><th>ID</th><th>Student</th><th>Certificate</th><th>Status</th><th></th></tr></thead><tbody id="il"></tbody></table></div></div></div></main>
<footer>© 2026 EduChain · Built on BOT Chain<br><a href="https://botchain.ai" target="_blank" rel="noopener">BOT Chain Website</a> · <a href="https://scan.bohr.life" target="_blank" rel="noopener">BOT Chain Explorer</a></footer><div id="toast"></div><script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script><script src="js/app.js"></script>
<script>
document.addEventListener("ready",async()=>{
  const i=await vault.institutions(account);
  if(i[1]){$("#gate").innerHTML='<div class="panel"><span class="badge ok">Approved institution</span> <b>'+esc(i[0])+'</b></div>';$("#inst").style.display="block";list()}
  else $("#gate").innerHTML='<div class="notice">This wallet isn’t an approved institution. Ask the network admin to register it.</div>';
});
async function list(){
  const ids=await vault.issuedBy(account);let h="";
  for(const id of [...ids].reverse()){const c=await vault.getCert(id);
    h+=`<tr><td>${id}</td><td><b>${esc(c[3])}</b><div class="mono" style="color:var(--mut)">${c[2].slice(0,10)}…</div></td><td>${esc(c[4])}</td><td>${c[7]?'<span class="badge bad">Revoked</span>':'<span class="badge ok">Valid</span>'}</td><td>${c[7]?"":`<button class="btn sm danger" data-r="${id}">Revoke</button>`}</td></tr>`}
  $("#il").innerHTML=h||'<tr><td colspan="5" class="empty">You haven’t issued any certificates yet.</td></tr>';
  document.querySelectorAll("[data-r]").forEach(b=>b.onclick=async()=>{if(confirm("Revoke certificate "+b.dataset.r+"? This can’t be undone.")&&await tx(vault.revoke(b.dataset.r),"Certificate revoked"))list()});
}
$("#iss").onclick=async()=>{
  const a=$("#sa").value.trim(),n=$("#sn").value.trim(),t=$("#ti").value.trim();
  if(!ethers.isAddress(a)||!n||!t)return toast("Enter a valid wallet, name and title",1);
  if(await tx(vault.issue(a,n,t,$("#fh").value.trim()),"Certificate issued")){["sa","sn","ti","fh"].forEach(x=>$("#"+x).value="");list()}
};
</script></body></html>
